<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaquisFlow — Connexion</title><link rel="stylesheet" href="/styles.css"></head><body><div class="wrap"><div class="login card"><div class="brand">Maquis<span>Flow</span></div><h1>Espace restaurant</h1><p class="muted">Connectez-vous pour gérer votre menu et vos commandes.</p><form id="f"><div class="field"><label>Email</label><input id="email" type="email" value="admin@chezawa.ci" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" value="admin123" required></div><button class="btn gold" style="width:100%">Se connecter</button></form><p class="small muted">Compte de démonstration : admin@chezawa.ci / admin123</p></div></div><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let d=await r.json();if(r.ok)location='/admin';else alert(d.error||'Erreur');}</script></body></html>
