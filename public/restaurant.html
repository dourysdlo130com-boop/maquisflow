<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202722"><title>La Cour des Grands — Menu</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="menu"><header class="menu-head"><div class="brand">LA COUR <span>DES GRANDS</span></div><div class="eyebrow" style="margin-top:32px;color:#dfc79d">Maquis · Grillades · Saveurs ivoiriennes</div><h1 id="rname">Une cuisine généreuse,<br>un moment à savourer.</h1><div id="tag">Découvrez notre carte.</div><div style="margin-top:25px;font-size:11px;letter-spacing:.14em;color:#dfc79d;text-transform:uppercase" id="tableLabel"></div></header>
<section class="wrap"><div class="eyebrow">À la carte</div><h2 class="section-title" style="font-size:30px;margin-bottom:18px">Faites votre choix.</h2><input class="search" id="q" placeholder="Rechercher un plat…"><div id="menu"></div><div class="cartbar"><span id="cartSummary">Votre panier est vide</span><button class="btn gold" id="checkout">Commander ↗</button></div><footer class="footer" style="margin-top:30px"><b>MAQUISFLOW</b><span> · Une expérience signée pour vous.</span></footer></section></main><div class="toast" id="toast"></div>
<script>
const params=new URLSearchParams(location.search);const slug=params.get('restaurant')||'chez-awa';const table=params.get('table')||'';let data=null,cart=[];
const money=n=>Number(n).toLocaleString('fr-FR')+' FCFA';
const $=id=>document.getElementById(id);
function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1600)}
async function load(){try{const response=await fetch('/api/public/'+encodeURIComponent(slug));data=await response.json();if(!response.ok)throw new Error(data.error||'Menu indisponible');$('rname').textContent=data.restaurant.name;$('tag').textContent=data.restaurant.tagline||'Découvrez notre carte.';$('tableLabel').textContent=table?'VOTRE TABLE · '+table:'COMMANDE À EMPORTER';render()}catch(e){$('menu').innerHTML='<div class="card">'+e.message+'</div>'}}
function render(){if(!data)return;const term=$('q').value.trim().toLocaleLowerCase('fr');$('menu').innerHTML='';for(const category of data.categories){const products=data.products.filter(p=>p.category_id===category.id&&p.available&&(!term||(p.name+' '+p.description).toLocaleLowerCase('fr').includes(term)));if(!products.length)continue;const section=document.createElement('section');section.className='cat';const heading=document.createElement('h2');heading.textContent=category.name;section.appendChild(heading);for(const p of products){const row=document.createElement('div');row.className='dish';const info=document.createElement('div');const name=document.createElement('h3');name.textContent=p.name;const desc=document.createElement('div');desc.className='muted small';desc.textContent=p.description||'';const price=document.createElement('div');price.className='price';price.textContent=money(p.price);info.append(name,desc,price);const btn=document.createElement('button');btn.className='btn gold';btn.textContent='+';btn.setAttribute('aria-label','Ajouter '+p.name);btn.onclick=()=>add(p.id);row.append(info,btn);section.appendChild(row)}$('menu').appendChild(section)}if(!$('menu').children.length){$('menu').innerHTML='<p class="muted">Aucun plat ne correspond à votre recherche.</p>'}update()}
function add(id){const item=cart.find(x=>x.id===id);if(item)item.q++;else cart.push({id,q:1});update();notify('Ajouté à votre panier')}
function update(){let total=0,count=0;for(const item of cart){const p=data.products.find(x=>x.id===item.id);if(p){total+=p.price*item.q;count+=item.q}}$('cartSummary').textContent=count?count+' article(s) · '+money(total):'Votre panier est vide';$('checkout').disabled=!count}
$('q').addEventListener('input',render);
$('checkout').onclick=async()=>{if(!cart.length)return;const items=cart.map(x=>({productId:x.id,quantity:x.q}));try{const response=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug,tableNumber:table,items})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Commande impossible');location.href=result.whatsappUrl}catch(e){notify(e.message)}};
load();
</script></body></html>
