<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaquisFlow — Dashboard</title><link rel="stylesheet" href="/styles.css"></head><body><div class="top"><div class="brand">Maquis<span>Flow</span></div><div class="row"><span id="rest"></span><button class="btn" onclick="logout()">Déconnexion</button></div></div><div class="wrap"><div class="nav"><button class="active" onclick="show('dashboard',this)">Tableau de bord</button><button onclick="show('orders',this)">Commandes</button><button onclick="show('menuTab',this)">Menu</button><button onclick="show('tables',this)">Tables / QR</button></div><section id="dashboard"><div class="grid grid4"><div class="card stat"><span class="muted">Commandes aujourd'hui</span><b id="ordersToday">—</b></div><div class="card stat"><span class="muted">Chiffre d'affaires</span><b id="revenue">—</b></div><div class="card stat"><span class="muted">Commandes actives</span><b id="active">—</b></div><div class="card stat"><span class="muted">Délai moyen</span><b id="avg">—</b></div></div><div class="grid grid2" style="margin-top:16px"><div class="card"><h2>Produits les plus vendus</h2><div id="top"></div></div><div class="card"><h2>Dernières commandes</h2><div id="recent"></div></div></div></section><section id="orders" style="display:none"><div class="card"><h2>Commandes</h2><div id="ordersList"></div></div></section><section id="menuTab" style="display:none"><div class="card"><div class="row between"><h2>Menu</h2><button class="btn gold" onclick="addProduct()">+ Ajouter</button></div><div id="products"></div></div></section><section id="tables" style="display:none"><div class="card"><h2>QR des tables</h2><p class="muted">Chaque QR ouvre le menu avec le numéro de table. Pour une version imprimable, utilisez l'URL affichée sous chaque table.</p><div id="tablesList" class="grid grid2"></div></div></section></div><div class="toast" id="toast"></div><script>
const money=n=>Number(n).toLocaleString('fr-FR')+' FCFA';let me;
async function api(u,o){let r=await fetch(u,o);if(r.status===401){location='/login';return null}let d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d}
async function init(){let m=await api('/api/me');if(!m?.authenticated)return location='/login';me=m.user;rest.textContent=me.restaurantName;loadDash();loadMenu();loadTables();}async function loadDash(){let d=await api('/api/dashboard');ordersToday.textContent=d.today.orders;revenue.textContent=money(d.today.revenue);active.textContent=d.active;avg.textContent=d.avg+' min';top.innerHTML=d.top.map((x,i)=>`<p><b>${i+1}. ${x.product_name}</b> — ${x.qty} vendu(s)</p>`).join('')||'<p class="muted">Pas encore de ventes.</p>';recent.innerHTML=d.recent.map(o=>`<p><b>#${o.id}</b> Table ${o.table_number||'—'} — ${money(o.total)} <span class="pill ${o.status}">${o.status}</span></p>`).join('')||'<p class="muted">Aucune commande.</p>';}
async function loadOrders(){let d=await api('/api/orders');ordersList.innerHTML='<table class="table"><thead><tr><th>#</th><th>Table</th><th>Articles</th><th>Total</th><th>Statut</th><th></th></tr></thead><tbody>'+d.orders.map(o=>`<tr><td>${o.id}</td><td>${o.table_number||'—'}</td><td>${o.items||''}</td><td>${money(o.total)}</td><td><span class="pill ${o.status}">${o.status}</span></td><td>${o.status!=='done'?`<button class="btn green" onclick="nextStatus(${o.id},'${o.status}')">${o.status==='new'?'Préparer':'Terminer'}</button>`:''}</td></tr>`).join('')+'</tbody></table>';}
async function nextStatus(id,s){await api('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s==='new'?'preparing':'done'})});loadOrders();loadDash();}
async function loadMenu(){let d=await api('/api/menu');products.innerHTML=d.products.map(p=>`<div class="dish"><div><h3>${p.name}</h3><div class="muted">${p.description}</div><b>${money(p.price)}</b> • ${p.available?'Disponible':'Indisponible'}</div><div class="row"><button class="btn" onclick="editProduct(${p.id},'${esc(p.name)}','${esc(p.description)}',${p.price},${p.available})">Modifier</button><button class="btn danger" onclick="deleteProduct(${p.id})">Supprimer</button></div></div>`).join('');}
function esc(s){return String(s).replaceAll('\\','\\\\').replaceAll("'","\\'")}
async function addProduct(){let name=prompt('Nom du plat ?');if(!name)return;let price=Number(prompt('Prix en FCFA ?'));if(!price)return;let desc=prompt('Description ?')||'';await api('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price,description:desc})});loadMenu();}
async function editProduct(id,n,d,p,a){let name=prompt('Nom',n);if(name===null)return;let price=Number(prompt('Prix',p));let desc=prompt('Description',d);await api('/api/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price,description:desc,available:a})});loadMenu();}
async function deleteProduct(id){if(!confirm('Supprimer ce produit ?'))return;await api('/api/products/'+id,{method:'DELETE'});loadMenu();}
async function loadTables(){let d=await api('/api/tables');tablesList.innerHTML=d.tables.map(t=>{let u=location.origin+'/restaurant?restaurant='+me.slug+'&table='+t.table_number;return `<div class="card"><h3>Table ${t.table_number}</h3><div class="qr">${u}</div><p class="small muted">QR à générer avec cette URL.</p></div>`}).join('');}
function show(id,btn){['dashboard','orders','menuTab','tables'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(id==='orders')loadOrders();if(id==='menuTab')loadMenu();if(id==='tables')loadTables();}
async function logout(){await api('/api/logout',{method:'POST'});location='/login'}init();
</script></body></html>
