<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu</title><link rel="stylesheet" href="/styles.css"></head><body><div class="menu"><div class="menu-head"><div class="brand">Maquis<span>Flow</span></div><h1 id="rname">Chargement…</h1><div id="tag"></div></div><div class="wrap"><input class="search" id="q" placeholder="Rechercher un plat…"><div id="menu"></div><div class="cartbar"><span id="cartSummary">Panier vide</span><button class="btn green" id="checkout">Commander sur WhatsApp</button></div></div></div><div class="toast" id="toast"></div><script>
const slug=new URLSearchParams(location.search).get('restaurant')||'chez-awa';const table=new URLSearchParams(location.search).get('table')||'';let data,cart=[];const money=n=>Number(n).toLocaleString('fr-FR')+' FCFA';
async function load(){let r=await fetch('/api/public/'+slug);data=await r.json();if(!r.ok)return alert(data.error);rname.textContent=data.restaurant.name;tag.textContent=data.restaurant.tagline;render();}function render(){const term=q.value.toLowerCase();menu.innerHTML='';for(const c of data.categories){const ps=data.products.filter(p=>p.category_id===c.id&&p.available&&(!term||p.name.toLowerCase().includes(term)));if(!ps.length)continue;const sec=document.createElement('section');sec.className='cat';sec.innerHTML='<h2>'+c.name+'</h2>'+ps.map(p=>`<div class="dish"><div><h3>${p.name}</h3><div class="muted small">${p.description}</div><div class="price">${money(p.price)}</div></div><button class="btn gold" onclick="add(${p.id})">+</button></div>`).join('');menu.appendChild(sec)}update();}function add(id){let x=cart.find(i=>i.id===id);if(x)x.q++;else cart.push({id,q:1});update();toast('Ajouté au panier');}function update(){let total=0,n=0;cart.forEach(i=>{let p=data.products.find(p=>p.id===i.id);total+=p.price*i.q;n+=i.q});cartSummary.textContent=n?`${n} article(s) • ${money(total)}`:'Panier vide';}function toast(t){toastEl=document.getElementById('toast');toastEl.textContent=t;toastEl.style.display='block';setTimeout(()=>toastEl.style.display='none',1200)}q.oninput=render;checkout.onclick=async()=>{if(!cart.length)return toast('Ajoutez au moins un plat');let items=cart.map(i=>({productId:i.id,quantity:i.q}));let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug,tableNumber:table,items})});let d=await r.json();if(!r.ok)return alert(d.error);location.href=d.whatsappUrl};load();
</script></body></html>
